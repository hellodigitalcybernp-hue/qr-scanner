<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="theme-color" content="#0E1116">
<title>Scan — Offline QR Reader</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>

  :root{
    --bg:      #0E1116;
    --panel:   #171B22;
    --panel-2: #1E232B;
    --line:    #2A303B;
    --ink:     #EDEFF2;
    --ink-dim: #8B93A1;
    --accent:  #3DDCC5;
    --accent-dim: #1F5A52;
    --danger:  #E5695C;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    overscroll-behavior: none;
  }

  #app{
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- header ---------- */

  header{
    padding: max(14px, env(safe-area-inset-top)) 18px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg);
  }

  header h1{
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: .01em;
  }

  header .dot{
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    display: inline-block;
    margin-right: 8px;
  }

  .icon-btn{
    width: 36px; height: 36px;
    border-radius: 10px;
    border: none;
    background: var(--panel);
    color: var(--ink-dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* ---------- scan view ---------- */

  .scan-stage{
    position: relative;
    flex: 1;
    background: #000;
    overflow: hidden;
    margin: 0 14px 14px;
    border-radius: 22px;
  }

  video{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .frame{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .frame .box{
    width: 62%;
    aspect-ratio: 1;
    max-width: 280px;
    position: relative;
  }

  .frame .box::before, .frame .box::after,
  .frame .box .c2, .frame .box .c3{
    content: "";
    position: absolute;
    width: 32px; height: 32px;
    border: 3px solid var(--accent);
  }

  .frame .box::before{ top:0; left:0; border-right:none; border-bottom:none; border-radius: 10px 0 0 0; }
  .frame .box::after{ top:0; right:0; border-left:none; border-bottom:none; border-radius: 0 10px 0 0; }
  .frame .box .c2{ bottom:0; left:0; border-right:none; border-top:none; border-radius: 0 0 0 10px; }
  .frame .box .c3{ bottom:0; right:0; border-left:none; border-top:none; border-radius: 0 0 10px 0; }

  .scanline{
    position: absolute;
    left: 6%; right: 6%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    top: 19%;
    animation: sweep 2.2s ease-in-out infinite;
    box-shadow: 0 0 10px 1px var(--accent);
  }

  @keyframes sweep{
    0%   { top: 19%; opacity: .2; }
    50%  { top: 81%; opacity: 1; }
    100% { top: 19%; opacity: .2; }
  }

  .hint-text{
    position: absolute;
    bottom: 18px; left: 0; right: 0;
    text-align: center;
    font-size: 13px;
    color: rgba(237,239,242,.85);
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }

  .stage-empty{
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px;
    padding: 30px;
    text-align: center;
    color: var(--ink-dim);
  }

  .stage-empty svg{ opacity: .5; }

  .stage-empty button{
    margin-top: 4px;
    padding: 11px 20px;
    background: var(--accent);
    color: #0A1210;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  /* ---------- controls ---------- */

  .controls{
    display: flex;
    gap: 10px;
    padding: 0 18px max(16px, env(safe-area-inset-bottom));
  }

  .ctrl-btn{
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer;
  }

  .ctrl-btn.primary{
    background: var(--accent);
    color: #0A1210;
    border-color: transparent;
  }

  #fileInput{ display: none; }

  /* ---------- result sheet ---------- */

  .sheet-backdrop{
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    display: none;
    z-index: 20;
  }
  .sheet-backdrop.open{ display: block; }

  .sheet{
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--panel);
    border-radius: 22px 22px 0 0;
    padding: 22px 20px max(22px, env(safe-area-inset-bottom));
    transform: translateY(110%);
    transition: transform .25s ease;
    z-index: 21;
  }
  .sheet.open{ transform: translateY(0); }

  .sheet .grabber{
    width: 40px; height: 4px; border-radius: 2px;
    background: var(--line);
    margin: 0 auto 18px;
  }

  .sheet .type-tag{
    display: inline-block;
    font-size: 11px;
    letter-spacing: .04em;
    color: var(--accent);
    background: var(--accent-dim);
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 12px;
  }

  .sheet .content-box{
    background: var(--panel-2);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    line-height: 1.5;
    word-break: break-word;
    white-space: pre-line;
    max-height: 30vh;
    overflow-y: auto;
    margin-bottom: 16px;
  }

  .sheet .sheet-actions{
    display: flex;
    gap: 10px;
  }

  .sheet .sheet-actions button{
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    border: none;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  .sheet .btn-primary{ background: var(--accent); color: #0A1210; }
  .sheet .btn-secondary{ background: var(--panel-2); color: var(--ink); border: 1px solid var(--line) !important; }

  /* ---------- history ---------- */

  .history-panel{
    position: fixed; inset: 0;
    background: var(--bg);
    transform: translateX(100%);
    transition: transform .22s ease;
    z-index: 30;
    display: flex;
    flex-direction: column;
  }
  .history-panel.open{ transform: translateX(0); }

  .history-header{
    display: flex; align-items: center; gap: 12px;
    padding: max(14px, env(safe-area-inset-top)) 18px 14px;
    border-bottom: 1px solid var(--line);
  }

  .history-header h2{ font-size: 17px; margin: 0; }

  .history-list{
    flex: 1;
    overflow-y: auto;
    padding: 8px 14px;
  }

  .history-item{
    padding: 14px 6px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }

  .history-item .txt{
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .history-item .meta{
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 4px;
  }

  .history-empty{
    text-align: center;
    color: var(--ink-dim);
    font-size: 14px;
    margin-top: 60px;
  }

  .toast{
    position: fixed;
    bottom: max(100px, calc(env(safe-area-inset-bottom) + 90px));
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 10px 16px;
    border-radius: 30px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 40;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  canvas{ display: none; }

</style>
</head>
<body>

<div id="app">

  <header>
    <h1><span class="dot"></span>Scan</h1>
    <button class="icon-btn" id="historyBtn" aria-label="History">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/><path d="M12 7v5l3 3"/></svg>
    </button>
  </header>

  <div class="scan-stage" id="stage">
    <video id="video" playsinline muted></video>
    <div class="frame" id="frame" style="display:none;">
      <div class="box"><span class="c2"></span><span class="c3"></span></div>
      <div class="scanline"></div>
    </div>
    <p class="hint-text" id="hintText" style="display:none;">Point your camera at a QR code</p>

    <div class="stage-empty" id="stageEmpty">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v3M17 20h3"/></svg>
      <div>Camera access is needed to scan live.<br>Works fully offline once started.</div>
      <button id="startCameraBtn">Turn on camera</button>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <div class="controls">
    <button class="ctrl-btn" id="torchBtn" style="display:none;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 22h4M12 2a5 5 0 0 0-3 9c1 .8 1 1.5 1 2.5h4c0-1 0-1.7 1-2.5a5 5 0 0 0-3-9Z"/></svg>
      Flash
    </button>
    <button class="ctrl-btn primary" id="uploadBtn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      Scan from photo
    </button>
    <input type="file" id="fileInput" accept="image/*">
  </div>

</div>

<!-- Result sheet -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <div class="grabber"></div>
  <span class="type-tag" id="typeTag">TEXT</span>
  <div class="content-box" id="resultContent"></div>
  <div class="sheet-actions">
    <button class="btn-secondary" id="copyBtn">Copy</button>
    <button class="btn-primary" id="openBtn">Open</button>
  </div>
</div>

<!-- History panel -->
<div class="history-panel" id="historyPanel">
  <div class="history-header">
    <button class="icon-btn" id="closeHistoryBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2>Scan history</h2>
  </div>
  <div class="history-list" id="historyList"></div>
</div>

<div class="toast" id="toast"></div>

<script src="jsQR.js"></script>
<script>

  // ---------- state ----------
  const $ = id => document.getElementById(id);
  let stream = null;
  let rafId = null;
  let lastResult = "";
  let lastResultTime = 0;
  let track = null;
  let torchOn = false;

  const video   = $("video");
  const canvas  = $("canvas");
  const ctx     = canvas.getContext("2d", { willReadFrequently: true });

  // ---------- history (localStorage) ----------
  const HISTORY_KEY = "qr_scan_history_v1";

  function loadHistory(){
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
    catch { return []; }
  }

  function saveHistory(list){
    localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 100)));
  }

  function addToHistory(text){
    const list = loadHistory();
    if (list[0] && list[0].text === text) return; // avoid duplicate spam
    list.unshift({ text, time: Date.now() });
    saveHistory(list);
  }

  function renderHistory(){
    const list = loadHistory();
    const el = $("historyList");
    if (list.length === 0){
      el.innerHTML = '<div class="history-empty">No scans yet</div>';
      return;
    }
    el.innerHTML = list.map((item, i) => `
      <div class="history-item" data-i="${i}">
        <div class="txt">${escapeHtml(item.text)}</div>
        <div class="meta">${new Date(item.time).toLocaleString()}</div>
      </div>
    `).join("");
    el.querySelectorAll(".history-item").forEach(node => {
      node.addEventListener("click", () => {
        const item = list[Number(node.dataset.i)];
        showResult(item.text);
      });
    });
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  // ---------- camera ----------
  async function startCamera(){
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();

      track = stream.getVideoTracks()[0];
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.torch){ $("torchBtn").style.display = "flex"; }

      $("stageEmpty").style.display = "none";
      $("frame").style.display = "flex";
      $("hintText").style.display = "block";

      tick();
    } catch (err){
      showToast("Camera unavailable — you can still scan from a photo.");
      console.error(err);
    }
  }

  function stopCamera(){
    if (rafId) cancelAnimationFrame(rafId);
    if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  }

  function tick(){
    if (video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
      if (code && code.data){
        const now = Date.now();
        if (code.data !== lastResult || now - lastResultTime > 2500){
          lastResult = code.data;
          lastResultTime = now;
          if (navigator.vibrate) navigator.vibrate(60);
          addToHistory(code.data);
          showResult(code.data);
        }
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  async function toggleTorch(){
    if (!track) return;
    try{
      torchOn = !torchOn;
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
      $("torchBtn").style.color = torchOn ? "var(--accent)" : "var(--ink-dim)";
    } catch { showToast("Flash not supported on this device."); }
  }

  // ---------- upload / decode from photo ----------
  function scanFile(file){
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => {
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if (code && code.data){
          addToHistory(code.data);
          showResult(code.data);
        } else {
          showToast("No QR code found in that image.");
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ---------- result sheet ----------

  // Parses common QR payload formats into a friendly {tag, display, action} shape.
  function classify(text){

    // Wi-Fi:  WIFI:T:WPA;S:MyNetwork;P:mypassword;H:false;;
    if (/^WIFI:/i.test(text)){
      const get = key => {
        const m = text.match(new RegExp(key + ":((?:[^\\\\;]|\\\\.)*);", "i"));
        return m ? m[1].replace(/\\(.)/g, "$1") : "";
      };
      const ssid = get("S"), pass = get("P"), type = get("T") || "—", hidden = get("H");
      return {
        tag: "WI-FI NETWORK",
        display: `Network: ${ssid || "—"}\nPassword: ${pass || "(none)"}\nSecurity: ${type}${hidden === "true" ? "\nHidden network" : ""}`,
        action: pass ? { label: "Copy password", value: pass } : null
      };
    }

    // vCard contact
    if (/^BEGIN:VCARD/i.test(text)){
      const name  = (text.match(/FN:(.*)/i)  || [,""])[1].trim();
      const tel   = (text.match(/TEL[^:]*:(.*)/i) || [,""])[1].trim();
      const email = (text.match(/EMAIL[^:]*:(.*)/i) || [,""])[1].trim();
      const org   = (text.match(/ORG:(.*)/i) || [,""])[1].trim();
      const lines = [name && `Name: ${name}`, org && `Org: ${org}`, tel && `Phone: ${tel}`, email && `Email: ${email}`].filter(Boolean);
      return { tag: "CONTACT CARD", display: lines.join("\n") || text, action: tel ? { label: "Call", href: "tel:" + tel } : null };
    }

    // Geo location: geo:37.786971,-122.399677
    if (/^geo:/i.test(text)){
      const coords = text.replace(/^geo:/i, "").split(",");
      return { tag: "LOCATION", display: `Latitude: ${coords[0]}\nLongitude: ${coords[1]}`, action: { label: "Open in Maps", href: `https://maps.google.com/?q=${coords[0]},${coords[1]}` } };
    }

    // SMS:  SMSTO:+1234567890:message  or  sms:+1234567890?body=message
    if (/^SMSTO:/i.test(text)){
      const [, number, body] = text.split(":");
      return { tag: "TEXT MESSAGE", display: `To: ${number}${body ? "\nMessage: " + body : ""}`, action: { label: "Send message", href: `sms:${number}${body ? "?body=" + encodeURIComponent(body) : ""}` } };
    }
    if (/^sms:/i.test(text)){
      return { tag: "TEXT MESSAGE", display: text.replace(/^sms:/i, "To: "), action: { label: "Send message", href: text } };
    }

    // Email
    if (/^mailto:/i.test(text)){
      return { tag: "EMAIL", display: text.replace(/^mailto:/i, ""), action: { label: "Compose email", href: text } };
    }

    // Phone
    if (/^tel:/i.test(text)){
      return { tag: "PHONE NUMBER", display: text.replace(/^tel:/i, ""), action: { label: "Call", href: text } };
    }

    // Calendar event (VEVENT)
    if (/^BEGIN:VEVENT/i.test(text)){
      const summary = (text.match(/SUMMARY:(.*)/i) || [,""])[1].trim();
      const loc     = (text.match(/LOCATION:(.*)/i) || [,""])[1].trim();
      const lines = [summary && `Event: ${summary}`, loc && `Location: ${loc}`].filter(Boolean);
      return { tag: "CALENDAR EVENT", display: lines.join("\n") || text, action: null };
    }

    // Link
    if (/^https?:\/\//i.test(text)){
      return { tag: "LINK", display: text, action: { label: "Open link", href: text } };
    }

    // Plain text fallback
    return { tag: "TEXT", display: text, action: null };
  }

  function showResult(text){
    const info = classify(text);
    $("typeTag").textContent = info.tag;
    $("resultContent").textContent = info.display;
    $("resultContent").dataset.raw = text;

    const openBtn = $("openBtn");
    if (info.action && info.action.href){
      openBtn.style.display = "block";
      openBtn.textContent = info.action.label;
      openBtn.onclick = () => window.open(info.action.href, "_blank");
    } else if (info.action && info.action.value){
      openBtn.style.display = "block";
      openBtn.textContent = info.action.label;
      openBtn.onclick = async () => {
        try { await navigator.clipboard.writeText(info.action.value); showToast("Copied"); }
        catch { showToast("Couldn't copy"); }
      };
    } else {
      openBtn.style.display = "none";
    }

    $("sheet").classList.add("open");
    $("sheetBackdrop").classList.add("open");
    lastResult = text;
    lastResultTime = Date.now();
  }

  function closeSheet(){
    $("sheet").classList.remove("open");
    $("sheetBackdrop").classList.remove("open");
  }

  function showToast(msg){
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.remove("show"), 2200);
  }

  // ---------- wire up UI ----------
  $("startCameraBtn").addEventListener("click", startCamera);
  $("uploadBtn").addEventListener("click", () => $("fileInput").click());
  $("fileInput").addEventListener("change", e => { if (e.target.files[0]) scanFile(e.target.files[0]); e.target.value = ""; });
  $("torchBtn").addEventListener("click", toggleTorch);

  $("sheetBackdrop").addEventListener("click", closeSheet);
  $("copyBtn").addEventListener("click", async () => {
    const raw = $("resultContent").dataset.raw || $("resultContent").textContent;
    try { await navigator.clipboard.writeText(raw); showToast("Copied"); }
    catch { showToast("Couldn't copy"); }
  });

  $("historyBtn").addEventListener("click", () => { renderHistory(); $("historyPanel").classList.add("open"); });
  $("closeHistoryBtn").addEventListener("click", () => $("historyPanel").classList.remove("open"));

  // try camera automatically on load
  window.addEventListener("load", () => {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      startCamera();
    } else {
      showToast("Camera not supported — use 'Scan from photo' instead.");
    }
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopCamera();
    else if (!stream) startCamera();
  });

  // register service worker for offline use
  if ("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }

</script>
</body>
</html>
